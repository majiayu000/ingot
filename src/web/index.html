<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<aside class="rail">
  <div class="brand">
    <span><svg viewBox="0 0 24 24" aria-hidden="true"><path class="mark" d="M6 8h12l3 10H3L6 8Z"/><path class="mark-top" d="M6 8h12l1 3H5l1-3Z"/></svg>Ingot</span>
    <button id="collapse" class="plain square" title="Hide sidebar" aria-label="Hide sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4ZM9 5v14"/></svg></button>
  </div>
  <button id="new" class="navrow"><span class="plus"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>New chat</button>
  <nav class="mainnav" aria-label="Main">
    <label class="navrow searchrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14ZM20 20l-4-4"/></svg><span class="sr">Search chats</span><input id="search" type="search" placeholder="Search chats"></label>
    <button data-go="models" class="navrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3ZM4 7.5l8 4.5 8-4.5M12 12v9"/></svg>Models</button>
    <button data-go="connect" class="navrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7V3M15 7V3M6 7h12v4a6 6 0 0 1-12 0V7ZM12 17v4"/></svg>Connect apps</button>
  </nav>
  <div class="lists">
    <h2 id="projects-title" hidden>Projects</h2>
    <ul id="projects"></ul>
    <h2 id="chats-title">Recents</h2>
    <ul id="chats"></ul>
  </div>
  <div class="foot">
    <button id="engine" data-go="monitor" class="engine" title="Monitor">
      <span class="avatar"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="mark" d="M6 8h12l3 10H3L6 8Z"/></svg></span>
      <span class="who"><b id="engine-model">Ingot</b><small><span id="engine-dot" class="dot"></span><span id="engine-state">Starting…</span></small></span>
    </button>
    <button data-go="settings" class="square" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
  </div>
</aside>
<div class="column">
  <button id="expand" class="plain square" title="Show sidebar" aria-label="Show sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4ZM9 5v14"/></svg></button>
  <section class="view chatview" data-for="chat">
    <header>
      <button id="menu" class="plain square" title="Conversations" aria-label="Conversations"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <span id="chat-title"></span>
      <span class="spacer"></span>
      <button id="star" class="plain" hidden aria-pressed="false">Star</button>
      <button id="export" class="plain" hidden title="Save this conversation as Markdown">Export</button>
    </header>
    <main id="scroll"><div class="log" id="log"></div></main>
    <footer>
      <button id="latest" class="latest" hidden aria-label="Jump to the latest message"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
      <h1 id="welcome"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="mark" d="M6 8h12l3 10H3L6 8Z"/><path class="mark-top" d="M6 8h12l1 3H5l1-3Z"/></svg><span id="greeting">Hello</span></h1>
      <div class="composer">
        <div id="attachments" class="chips"></div>
        <textarea id="input" rows="1" placeholder="How can I help you today?" aria-label="Message"></textarea>
        <div class="line">
          <button id="attach" class="square" title="Attach images, PDFs or text files" aria-label="Attach a file"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <button id="options-toggle" class="square" title="Chat options" aria-label="Chat options" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4"/></svg></button>
          <select id="thinking" class="pick" title="Thinking" aria-label="Thinking">
            <option value="">Think: default</option><option value="none">Think: off</option><option value="low">Think: low</option><option value="medium">Think: medium</option><option value="high">Think: high</option>
          </select>
          <input id="file" type="file" multiple hidden>
          <span class="spacer"></span>
          <span id="context" hidden><span id="context-text"></span><span class="sr"><span id="context-bar"></span></span></span>
          <select id="model" class="quiet" title="Model" aria-label="Model"><option value="">Loading…</option></select>
          <button id="send" class="square" aria-label="Send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
          <button id="stop" class="square" aria-label="Stop" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg></button>
        </div>
      </div>
      <div id="options" hidden>
        <label>Project <select id="project"></select></label>
        <label>Temperature <input id="temperature" type="number" min="0" max="2" step="0.1" placeholder="Model default"></label>
        <label>Max tokens <input id="max_tokens" type="number" min="1" step="1" placeholder="Automatic"></label>
        <label class="wide">System prompt <textarea id="system" placeholder="Instructions for this conversation"></textarea></label>
        <label>Output <select id="format"><option value="">Text</option><option value="json">JSON object</option></select></label>
      </div>
      <div id="starters">
        <button data-start="pdf"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6v18h12V7l-4-4ZM14 3v4h4"/></svg>Read a PDF</button>
        <button data-start="Write a function that "><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 8-4 4 4 4M16 8l4 4-4 4"/></svg>Write code</button>
        <button data-start="Translate into English: "><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>Translate</button>
        <button data-start="models"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3ZM4 7.5l8 4.5 8-4.5M12 12v9"/></svg>Pick a model</button>
      </div>
      <div id="status" role="status"></div>
    </footer>
  </section>
  <section class="view page" data-for="models" id="library"></section>
  <section class="view page" data-for="model" id="detail"></section>
  <section class="view page" data-for="custom" id="custom"></section>
  <section class="view page" data-for="monitor"><h1>Monitor</h1><div class="cards" id="cards"></div><div class="recent" id="recent"></div></section>
  <section class="view page" data-for="connect" id="connect"></section>
  <section class="view page" data-for="settings" id="preferences"></section>
</div>
</div>
<div id="keybox" class="keybox" hidden>
  <form id="keyform"><label for="keyinput" id="keylabel"></label><input id="keyinput" type="password" autocomplete="off">
    <div><button type="button" id="keycancel">Cancel</button><button class="gold">OK</button></div></form>
</div>
<script src="chat.js"></script>
<script src="monitor.js"></script>
<script src="models.js"></script>
<script src="settings.js"></script>
<script src="shell.js"></script>
</body>
</html>
